<!DOCTYPE html>

<html lang = "en">

<head>
    <meta charset="utf-8">
    <title>Course Catalog Display</title>
    <link href="style.css" rel="stylesheet" type="text/css">
</head>

<body>

    <!--Header-->

    <div class="container">
        <header class="site_header">
            <img src="logo-white.svg" alt="UofL_logo" class="logo">
            <h1>UofL Course Catalog</h1>
        </header>
    </div>

    <!--Search Bar-->

    <div class="search-bar">
        <input type="text" id="descr">
        <button id="getCard" type="button">Search</button>
    </div>

    <!--Card Display-->

    <div class="display-cards">
        <div id="course-cards" class="course-cards"></div>
    </div>

    <!--JavaScript-->
    <script src="../back-end/data-storage.js"></script>
</body>
