<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UofL Course Catalog</title>
    <link href="style.css" rel="stylesheet" type="text/css">
</head>

<body>

    <!--Header-->

    <div class="container">
        <header class="site_header">
            <img src="logo-white.svg" alt="UofL_logo" class="logo">
            <h1>UofL Course Catalog</h1>
        </header>
    </div>

    <!--Search Bar-->

    <main>
        <div class="search-bar">
            <label for="descr">Search by subject, course number, or title</label>
            <div class="search-controls">
                <input type="search" id="descr" placeholder="Try Chemistry">
                <button id="getCard" type="button">Search</button>
            </div>
        </div>

        <p id="status-message" class="status-message" role="status"></p>

    <!--Card Display-->

        <div class="display-cards">
            <div id="rand-cards" class="course-cards"></div>
            <div id="course-cards" class="course-cards"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
